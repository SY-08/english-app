<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English Time</title>
  <meta name="theme-color" content="#FFF6EC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="start">
  <header class="appbar">
    <button class="home-btn" id="homeBtn" aria-label="ホーム">⌂</button>
    <div class="mode-switch" role="group" aria-label="モード切り替え">
      <button data-mode="kids" aria-pressed="false">こども</button>
      <button data-mode="adult" aria-pressed="false">おとな</button>
    </div>
    <button class="gear" id="openSettings" aria-label="せってい">⚙</button>
  </header>

  <main id="view"></main>

  <!-- 応援キャラクター：①の動画がベース、②③はアクションで再生 -->
  <div class="cheer" id="cheer" aria-label="おうえん キャラクター">
    <video id="cheerIdle" src="media/cheer-idle.mp4" muted loop playsinline autoplay preload="auto"></video>
    <video id="cheerAct" muted playsinline preload="auto"></video>
    <p class="bubble" id="cheerBubble"></p>
  </div>
  <div class="clear-stage" id="clearStage" aria-live="polite">
    <div class="confetti"></div>
    <p class="clear-msg"></p>
    <small>タップで とじる</small>
  </div>

  <dialog id="settings"></dialog>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
